# Prometheus scrape config for the core nodes.
# Each core node serves /metrics on CORE_NODE_PORT, else 9700 + nodeId (CoreClusteredService.startNodeEndpoint).
# Loopback-only by design: run Prometheus on the same box or tunnel; never expose these ports publicly.
global:
  scrape_interval: 5s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: core-nodes           # cluster-kit NodeEndpoint: /metrics, /health, /ready
    metrics_path: /metrics
    static_configs:
      - targets: ['localhost:9700', 'localhost:9701', 'localhost:9702']
