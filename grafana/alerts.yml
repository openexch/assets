# Prometheus alert rules for the core (OMS + ledger core).
# Every expression names a series the node registers (AlertsFileTest checks this against OrderEngineMetrics).
groups:
  - name: core
    rules:
      - alert: FeedDuplicateMismatch
        expr: increase(core_feed_duplicate_mismatch_total[5m]) > 0
        labels: {severity: page}
        annotations:
          summary: "A feed copy at an applied journalSeq differs from what was applied (in-epoch ME rewind or corrupt copy)"

      - alert: FeedUnverifiedNoLaneBehind
        # per instance, same labels on both sides; the 5m window on both sides keeps a lane that just caught up from paging
        expr: increase(core_feed_duplicate_unverified_total[5m]) > 0 and max_over_time(core_feed_lanes_behind[5m]) == 0
        labels: {severity: page}
        annotations:
          summary: "Feed duplicates older than the digest window while no bridge lane is catching up"

      - alert: FeedUnverifiedLong
        expr: increase(core_feed_duplicate_unverified_total[5m]) > 0
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "Unverifiable feed duplicates for 30m (a lane far behind, or a dead registered bridge lane)"

      - alert: FeedLatched
        expr: max(core_feed_latch_reason) > 0
        labels: {severity: page}
        annotations:
          summary: "The ME feed is latched (FeedHaltReason code in the value); order entry is closed by BRIDGE_HALT"

      - alert: GlobalGateClosed
        # the registered GLOBAL reason bitmask; the existing core_order_entry_gate gauge stays
        expr: min(core_order_entry_gate_reasons) > 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "The global order-entry gate has carried a reason for 5m"

      - alert: MeLinkFault
        expr: >-
          increase(core_me_leg_live_total[5m]) > 0
          or increase(core_me_invalid_total[5m]) > 0
          or increase(core_me_release_early_total[5m]) > 0
          or increase(core_me_amend_mismatch_total[5m]) > 0
          or increase(core_me_link_mismatch_total[5m]) > 0
          or increase(core_late_apply_on_dead_order_total[5m]) > 0
          or increase(core_terminal_with_pending_create_total[5m]) > 0
          or increase(core_leg_zero_refused_total[5m]) > 0
        labels: {severity: page}
        annotations:
          summary: "The ME told the core something a correct ME never says (LEG_LIVE, INVALID, RELEASED early, amend mismatch, link mismatch, late apply, leg 0)"

      - alert: MeCapacityWhileOpen
        expr: increase(core_me_capacity_while_open_total[5m]) > 0
        labels: {severity: warning}
        annotations:
          summary: "A CAPACITY outcome while ME_CAPACITY was clear (expected once after an ADMIN override)"

      - alert: ReleaseBacklogParked
        expr: max(core_release_backlog_parked) > 0
        labels: {severity: page}
        annotations:
          summary: "A release backlog entry is PARKED: a leg may rest at the ME for an order the core ended (operator exit)"

      - alert: DispatchStuck
        # Replaces the forwarder spec's nonexistent core pending-age alarm (rc2-forwarder.md:600)
        expr: changes(core_pending_oldest_seq[2m]) == 0 and core_pending_commands > 0 and core_me_capacity_parked == 0
        labels: {severity: page}
        annotations:
          summary: "The oldest pending ME command has not moved for 2m and nothing waits on capacity"

      - alert: ReleasePathStuck
        expr: changes(core_release_backlog_oldest_seq[10m]) == 0 and (core_release_backlog - core_release_backlog_parked) > 0
        labels: {severity: page}
        annotations:
          summary: "The oldest unconfirmed release has not moved for 10m"

      - alert: MeCapacityParked
        expr: max(core_me_capacity_parked) > 0
        for: 60s
        labels: {severity: warning}
        annotations:
          summary: "Commands wait after a CAPACITY outcome for 60s (the forwarder resync re-offers them at the reopen)"

      - alert: CoreOrderMoneyRefused
        expr: increase(core_order_hold_refused_total[5m]) > 0 or increase(core_order_release_refused_total[5m]) > 0
        labels: {severity: warning}
        annotations:
          summary: "A TOOL/ADMIN Hold or Release named a core orderId under behaviour 3 and was refused"

      # core_ticks_unbound_total is exported and NOT alerted: the core registers a forwarder before it
      # binds the ME epoch, so ticks before the bind are counted there legitimately.
      - alert: CoreTickEpochDrops
        expr: increase(core_ticks_epoch_drop_total[5m]) > 0
        labels: {severity: page}
        annotations:
          summary: "A MarketTick carried a foreign meEpoch and was dropped (a forwarder defect: it must not send one it can recognise)"

      - alert: CoreTickInvalid
        expr: increase(core_ticks_invalid_total[5m]) > 0
        labels: {severity: page}
        annotations:
          summary: "A malformed, crossed or unknown-market MarketTick reached the core (no correct forwarder sends one)"
